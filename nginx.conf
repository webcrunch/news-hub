server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Försök hitta filen först, annars skicka index.html för att stödja SolidJS routing
        try_files $uri $uri/ /index.html;
    }

    # Standard-felhantering
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}