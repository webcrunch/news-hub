name: Build and Deploy NewsHub

on:
    push:
        branches: ["main"]

jobs:
    # JOBB 1: Bygg appen (Node 24 + Tailwind v4) och pusha imagen till Docker Hub
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # Hämta Docker-hemligheter från din Vault
            - name: Import Secrets from Vault
              uses: hashicorp/vault-action@v3
              with:
                  url: https://vault.jarllindquist.com
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  secrets: |
                      kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
                      kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ env.DOCKER_USERNAME }}
                  password: ${{ env.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  target: production
                  push: true
                  tags: ${{ env.DOCKER_USERNAME }}/news-hub:latest

    # JOBB 2: Deploya till din Ubuntu-VPS
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # FIX: Hämta både Server- OCH Docker-hemligheter från Vault till detta jobb
            - name: Import Secrets from Vault
              uses: hashicorp/vault-action@v3
              with:
                  url: https://vault.jarllindquist.com
                  method: approle
                  roleId: ${{ secrets.VAULT_ROLE_ID }}
                  secretId: ${{ secrets.VAULT_SECRET_ID }}
                  secrets: |
                      kv/data/server-deploy SSH_HOST | SERVER_HOST ;
                      kv/data/server-deploy SSH_USERNAME | SERVER_USER ;
                      kv/data/server-deploy SERVER_PORT | SERVER_PORT ;
                      kv/data/server-deploy SSH_PRIVATE_KEY | SSH_PRIVATE_KEY ;
                      kv/data/server-deploy DOCKER_USERNAME | DOCKER_USERNAME ;
                      kv/data/server-deploy DOCKER_PASSWORD | DOCKER_PASSWORD

            # FIX: Hårdkoda sökvägen till exakt /home/repos/news-hub
            - name: Create target directory on VPS
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ env.SERVER_HOST }}
                  username: ${{ env.SERVER_USER }}
                  key: ${{ env.SSH_PRIVATE_KEY }}
                  port: ${{ env.SERVER_PORT }}
                  script: |
                      mkdir -p /home/repos/news-hub

            # FIX: Kopiera docker-compose.prod.yml till exakt /home/repos/news-hub
            - name: Copy docker-compose files to VPS
              uses: appleboy/scp-action@master
              with:
                  host: ${{ env.SERVER_HOST }}
                  username: ${{ env.SERVER_USER }}
                  key: ${{ env.SSH_PRIVATE_KEY }}
                  port: ${{ env.SERVER_PORT }}
                  source: "docker-compose.prod.yml"
                  target: "/home/repos/news-hub"

            # Logga in via SSH, logga in på Docker Hub, dra ner bilden och starta om via Traefik
            - name: Execute Deploy Commands
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ env.SERVER_HOST }}
                  username: ${{ env.SERVER_USER }}
                  key: ${{ env.SSH_PRIVATE_KEY }}
                  port: ${{ env.SERVER_PORT }}
                  envs: DOCKER_USERNAME,DOCKER_PASSWORD
                  script: |
                      cd /home/repos/news-hub

                      # Autentisera din VPS mot Docker Hub med dina Vault-uppgifter
                      echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

                      # Hämta den senaste bilden
                      docker compose -f docker-compose.prod.yml pull

                      # Starta om containern (--force-recreate tvingar fram att den nyss nedladdade bilden används)
                      docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

                      # Rensa bort gamla oanvända docker-avbildningar så inte harddisken fylls upp
                      docker image prune -f

                      # Logga ut från Docker Hub på VPS:en för ökad säkerhet
                      docker logout
