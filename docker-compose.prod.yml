services:
  news-hub-prod:
    image: passwordnotsafe/news-hub:latest
    container_name: news-hub-production
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.newshub.rule=Host(`jarllindquist.com`) && PathPrefix(`/news`)"
      - "traefik.http.routers.newshub.entrypoints=websecure"
      - "traefik.http.routers.newshub.tls=true"

      # --- Klipper bort /news innan Nginx tar emot anropet ---
      - "traefik.http.middlewares.newshub-strip.stripprefix.prefixes=/news"
      - "traefik.http.routers.newshub.middlewares=newshub-strip@docker"
      # --------------------------------------------------------

      - "traefik.http.services.newshub.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
